workspaces:
- dir: 'web'
  cmd: 'npm run dev'
- dir: 'examples/go-fiber'
  cmd:
    - echo "go-fiber"
    - go build
  bin_path: 'go-fiber'
- dir: 'examples/nodejs'
  cmd:
    - echo "nodejs"
    - npm start
- dir: 'examples/rust-actix'
  cmd:
    - echo "rust-actix"
    - cargo build
  bin_path: 'target/debug/rust-actix'
  ignore:
    - 'examples/rust-actix/target/'
- dir: 'examples/bun'
  cmd:
    - echo "bun expressjs"
    - bun --watch ./server.ts
